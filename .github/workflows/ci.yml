name: CI

# Two jobs, not six.
#
# Actions bills each job rounded UP to the whole minute, and every job pays a
# fresh checkout plus a fresh `pnpm install` before it does anything useful.
# Six jobs meant six of those, and the 6-second boundary-grep job still billed
# a full minute. The RLS and E2E jobs each pulled the entire Supabase Docker
# stack — the single most expensive thing in the run, done twice.
#
# Coverage is unchanged: every check that ran before still runs. They are just
# grouped by what they need, so the expensive setup happens once.
#
#   checks      — no services. Static analysis, boundaries, unit, relay.
#   integration — needs Postgres. One `supabase start`, then pgTAP and E2E.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Everything that needs no database. Ordered cheapest-first so a lint error
  # does not wait behind workerd booting.
  # ───────────────────────────────────────────────────────────────────────────
  checks:
    name: Static · boundaries · unit · relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # ── Security boundaries ──────────────────────────────────────────────
      # ESLint covers the AST cases; these catch the rest — string
      # interpolation, template config, comments that become code.

      - name: Service-role key must not reach client-reachable code
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' \
               -e 'SUPABASE_SERVICE_ROLE_KEY' -e 'SUPABASE_SECRET_KEY' \
               apps/*/src \
             | grep -v '/src/server/'; then
            echo "::error::Service-role key referenced outside src/server/ — it bypasses RLS entirely."
            exit 1
          fi
          echo "ok: service-role key confined to src/server/"

      - name: set_config may only appear in the withUserContext helper
        run: |
          # R-02: one helper owns the claim, or the guarantee is unenforceable.
          if grep -rn --include='*.ts' --include='*.tsx' 'set_config' \
               apps packages --exclude-dir=node_modules --exclude-dir=generated \
             | grep -v 'packages/db/src/index.ts'; then
            echo "::error::set_config outside packages/db/src/index.ts. See docs/05-resolution-plan.md R-02."
            exit 1
          fi
          echo "ok: set_config confined to the withUserContext helper"

      - name: Supabase query errors must not be swallowed
        run: |
          # `const { data } = await supabase...` is the shortest thing to
          # write and quietly the wrong thing: on error `data` is null and the
          # page renders as though the table were empty, so "nothing here yet"
          # and "the query is broken" look identical. That shipped three times
          # in Phase 1. `must()` throws instead.
          # Comment lines excluded: the helper's own docstring necessarily
          # contains the pattern it exists to replace.
          if grep -rn --include='*.ts' --include='*.tsx' \
               -E 'const \{ *data(: *[A-Za-z_]+)? *\} *= *await' \
               apps/*/src \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)'; then
            echo "::error::Use must(query, what) from @/lib/supabase/query — a bare { data } destructure hides query errors as empty results."
            exit 1
          fi
          echo "ok: no swallowed query errors"

      - name: Relative imports must not carry .js extensions
        run: |
          # They resolve under vitest and NOT under Next's bundler, so the
          # failure appears only at build time, in a package that tested green.
          # `generated/` is excluded: Prisma emits real .js and the import
          # must name it.
          if grep -rn --include='*.ts' --include='*.tsx' \
               -E 'from "\.{1,2}/[^"]+\.js"' \
               apps/*/src packages/*/src packages/*/test \
             | grep -v '/generated/'; then
            echo "::error::Drop the .js extension — it resolves under vitest but not under Next's bundler."
            exit 1
          fi
          echo "ok: no .js extensions in relative imports"

      - name: A migration that creates a table must secure it
        run: |
          # The pgTAP suite catches an unprotected table after the fact; this
          # catches it in review, naming the file. Every `create table
          # public.x` needs `enable row level security` in the SAME migration.
          fail=0
          for file in supabase/migrations/*.sql; do
            tables=$(grep -oiE 'create table (if not exists )?public\.[a-z_]+' "$file" \
                     | sed -E 's/.*public\.//' | sort -u)
            for table in $tables; do
              if ! grep -qiE "alter table public\.$table enable row level security" "$file"; then
                echo "::error file=$file::Table '$table' is created here but never has RLS enabled in this migration."
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "ok: every table is secured in the migration that creates it"

      - name: FTS must be language-aware (R-14)
        run: |
          # `to_tsvector('english', …)` stems incorrectly for every other
          # language and mangles CJK entirely. build_tsvector() defaults to
          # `simple`. Retrofitting a generated column across a populated table
          # is an outage, so this is a merge gate rather than a review note.
          #
          # Comment lines are excluded: the migrations that warn against this
          # pattern necessarily contain it.
          if grep -rn --include='*.sql' --include='*.ts' \
               -iE "to_tsvector\(\s*'(english|simple)'" \
               supabase packages apps --exclude-dir=node_modules --exclude-dir=generated \
             | grep -v 'text_search_config' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(--|//|\*)'; then
            echo "::error::Hardcoded FTS config. Use public.build_tsvector(language, body) — docs/05-resolution-plan.md R-14."
            exit 1
          fi
          echo "ok: no hardcoded text search configuration"

      # ── Tests that need no services ──────────────────────────────────────
      - run: pnpm --filter @porcupine/crypto test

      # Discovery's SSRF suite makes a few real outbound requests on purpose:
      # DNS resolution and redirect handling are what is under test, and a
      # mocked resolver would prove nothing about either.
      - run: pnpm --filter @porcupine/discovery test

      # The anchoring engine is pure logic with no services, and it is the
      # highest-consequence code in Phase 1 — every Phase 2 extraction will
      # resolve through it.
      - run: pnpm --filter @porcupine/anchoring test

      # R-21. Real workerd, real Durable Objects — an in-process mock would
      # prove nothing about the part that is actually uncertain.
      - run: pnpm --filter @porcupine/relay test

  # ───────────────────────────────────────────────────────────────────────────
  # Everything that needs Postgres. The Supabase stack starts ONCE here and is
  # reused by both the RLS suite and the E2E run — it was previously started
  # twice, which was the largest single cost in the workflow.
  #
  # THE merge gate lives in this job: untested RLS is not security.
  # docs/05-resolution-plan.md R-02 · hazard B-03 (keep pgTAP under 90s).
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: RLS suite · E2E · accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      # Pulling Docker images is the single largest cost in this workflow, so
      # only the containers the tests actually use are started: postgres,
      # kong, gotrue, postgrest, and mailpit — five instead of twelve.
      #
      # Mailpit stays because the E2E flow signs up for real and reads its OTP
      # out of it. postgres-meta and studio are developer tooling; logflare
      # and vector are log shipping; supavisor is the pooler, which the tests
      # bypass by connecting directly. None of them is exercised here, and
      # each one is an image to fetch on every run.
      - name: Start Supabase
        run: |
          pnpm exec supabase start \
            -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      - name: Apply migrations
        run: pnpm exec supabase db reset --no-seed

      # ── RLS: the merge gate ──────────────────────────────────────────────
      - name: Run RLS suite
        run: pnpm db:test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Assert no table escaped RLS
        run: |
          # Belt and braces: the pgTAP suite asserts this too, but a migration
          # that fails halfway could leave a table exposed with tests skipped.
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -At -c "
              select c.relname from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname='public' and c.relkind='r'
                and c.relname <> '_prisma_migrations'
                and (c.relrowsecurity = false or c.relforcerowsecurity = false);
            " > /tmp/unprotected.txt
          if [ -s /tmp/unprotected.txt ]; then
            echo "::error::Tables without FORCE RLS:"; cat /tmp/unprotected.txt; exit 1
          fi
          echo "ok: every public table has RLS enabled and forced"

      - name: Schema and migrations must not have drifted
        run: |
          # The database was just built from supabase/migrations/. If it does
          # not match schema.prisma, one of the two was edited without the
          # other — which is how a hand-written generated column or index gets
          # silently dropped by the next `db:diff`.
          if ! pnpm db:diff 2>&1 | grep -q 'No drift'; then
            echo "::error::schema.prisma and supabase/migrations/ disagree. Run pnpm db:diff."
            pnpm db:diff || true
            exit 1
          fi
          echo "ok: no drift between schema.prisma and the applied migrations"
        env:
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # ── E2E + accessibility (G-07) ───────────────────────────────────────
      # Accessibility is a launch requirement and a procurement gate.
      # Retrofitting it at Phase 7 is the classic way to miss it.
      - name: Write env for the app
        run: |
          # Local stack keys are fixed and public; this is not a secret.
          cat > .env <<'ENV'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
          SUPABASE_SECRET_KEY="sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz"
          ENV
          ln -sf ../../.env apps/web/.env.local

      # Browsers are ~100MB and unchanged between runs; the cache turns a
      # download into a restore.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # Deps are still needed even on a cache hit — the browser binary is
      # cached, the system libraries it links against are not.
      - run: pnpm exec playwright install-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm --filter @porcupine/web build
      - run: pnpm --filter @porcupine/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
