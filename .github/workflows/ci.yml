name: CI

# One job, and it runs the same script you run.
#
# This file used to restate every check inline: six jobs, then two, then one
# job of thirty-one steps, seven of which were grep guards written out in YAML.
# Those same seven greps also lived in scripts/guards.sh, which is how a guard
# gets fixed in one copy and quietly rots in the other — the YAML copy had
# already shipped a broken carve-out that never matched anything.
#
# So CI no longer describes the checks. It calls `pnpm verify --e2e`, which is
# the exact command to run locally. The two cannot drift, because there is only
# one of them.
#
# What is left here is only what a laptop cannot provide, and it is the whole
# reason this file still exists:
#
#   * a CLEAN checkout on Linux — no stale node_modules, no warm database
#   * --frozen-lockfile, proving the lockfile is complete
#   * it runs for changes nobody remembered to check
#
# The merge gate — untested RLS is not security — lives inside `pnpm verify`,
# not here. docs/05-resolution-plan.md R-02 · hazard B-03 (pgTAP under 90s).
#
# The relay suite is NOT in this workflow. It lives in relay.yml, fired only
# when apps/relay or the shared ticket format changes: it downloads and boots
# workerd to exercise Phase 5 infrastructure most pull requests never touch.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Verify on a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Pulling Docker images is the single largest cost in this workflow, so
      # only the containers the tests actually use are started: postgres, kong,
      # gotrue, postgrest and mailpit — five instead of twelve.
      #
      # Mailpit stays because the E2E flow signs up for real and reads its OTP
      # out of it. postgres-meta and studio are developer tooling; logflare and
      # vector are log shipping; supavisor is the pooler, which the tests bypass
      # by connecting directly. None is exercised here, and each is an image to
      # fetch on every run.
      - name: Start Supabase
        run: |
          pnpm exec supabase start \
            -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      # Local stack keys are fixed and public; this is not a secret.
      - name: Write env for the app
        run: |
          cat > .env <<'ENV'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
          SUPABASE_SECRET_KEY="sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz"
          ENV
          ln -sf ../../.env apps/web/.env.local

      # Browsers are ~100MB and unchanged between runs; the cache turns a
      # download into a restore.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # Deps are still needed even on a cache hit — the browser binary is
      # cached, the system libraries it links against are not.
      - run: pnpm exec playwright install-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # Typecheck, lint, format, the seven guards, four unit suites, migrations,
      # pgTAP, the RLS catalogue check, drift, build, browser + axe.
      - name: pnpm verify --e2e
        run: pnpm verify --e2e
        env:
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
